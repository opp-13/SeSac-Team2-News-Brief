# Alembic 설정 (C 소유 — DB 마이그레이션 창구, CLAUDE.md §3 / §5 규칙 6)
#
# 실행은 backend/ 에서 한다.
#   .venv/bin/alembic upgrade head
#   .venv/bin/alembic downgrade -1
#   .venv/bin/alembic revision -m "설명"        # 빈 리비전
#   .venv/bin/alembic revision --autogenerate -m "설명"
#
# **접속 정보는 여기에 쓰지 않는다.** sqlalchemy.url 을 비워 두고 env.py 가
# app.core.config 의 DATABASE_URL(환경변수 / backend/.env)에서 읽는다.
# 시크릿을 커밋되는 파일에 넣지 않기 위함이다 (CLAUDE.md §7).

[alembic]
script_location = app/db/migrations
prepend_sys_path = .

# 리비전 파일 이름: 0001_v2_initial_schema.py 처럼 순번이 앞에 오게 한다.
# 날짜 기반 접두사를 쓰면 브랜치마다 순서가 뒤섞여 head 추적이 어려워진다.
file_template = %%(rev)s_%%(slug)s

# env.py 가 채운다. 여기에 접속 정보를 적지 말 것.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
