# 로컬 개발 스택 (MySQL 8.0 · Redis · API). CLAUDE.md §5 "0주차에 넷이 함께" 항목.
#
# 사용법:
#   cp .env.example .env      # 값을 채운다 (비밀번호 등)
#   docker compose up -d mysql redis      # DB/캐시만 띄우고 API는 호스트에서 uvicorn으로
#   docker compose up -d                  # API까지 컨테이너로
#
# 비밀번호는 이 파일에 쓰지 않는다 (CLAUDE.md §7). `${VAR:?...}` 문법이라 .env에 값이
# 없으면 기동 시점에 바로 실패한다 — 기본 비밀번호를 심어두는 것보다 안전하다.

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env에 MYSQL_ROOT_PASSWORD를 설정하세요}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-news_ai}
      MYSQL_USER: ${MYSQL_USER:-newsbrief}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env에 MYSQL_PASSWORD를 설정하세요}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 최초 기동 시 스키마를 자동 적용한다. 컨테이너를 처음 만들 때만 실행되므로,
      # 스키마를 바꾼 뒤에는 `docker compose down -v`로 볼륨을 지워야 다시 반영된다.
      # [주의] 스키마 V2 제안이 검토 중이다 (docs/db/schema-v2-proposal.md).
      - ./docs/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # 세션/캐시/락 전용이다. 요약·번역 본문을 여기 저장하지 않는다 (CLAUDE.md §8-6).
    # 개발 편의상 영속화를 켜 둔다 — 재시작할 때마다 로그인이 풀리지 않도록.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      # 컨테이너 안에서는 호스트가 localhost가 아니라 서비스명이다.
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-newsbrief}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-news_ai}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      API_VERSION: ${API_VERSION:-dev}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
