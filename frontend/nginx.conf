user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;
        root         /usr/share/nginx/html;

        # React Router client-side routing -- fall back to index.html for
        # any path that isn't a real static file.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # api.team2.local is the internal NLB's private DNS alias
        # (infra/modules/network/dns.tf) -- requires enable_private_dns =
        # true. `resolver` + a variable forces nginx to resolve this at
        # REQUEST time instead of once at config-load/startup -- with a
        # bare hostname in proxy_pass, nginx resolves it once at startup
        # and refuses to start at all ("host not found in upstream") if
        # that lookup fails, e.g. before the zone/record exists yet or
        # during a transient DNS blip. This way a resolution failure just
        # 502s that one request instead of taking the whole container down.
        # 127.0.0.11 is Docker's embedded per-container DNS, which forwards
        # to whatever resolver the host (the EC2 instance) is configured
        # with -- the VPC's own DNS in this case.
        resolver 127.0.0.11 valid=10s;

        location /api/ {
            set $backend_upstream api.team2.local;
            proxy_pass http://$backend_upstream:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
