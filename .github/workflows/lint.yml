name: Lint & Format Check

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      newscollect: ${{ steps.filter.outputs.newscollect }}

    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            newscollect:
              - 'newscollect/**'

  lint-newscollect:
    needs: changes
    if: needs.changes.outputs.newscollect == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: newscollect

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: newscollect/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .