name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'deploy/frontend/**'
            backend:
              - 'backend/**'
              - 'deploy/backend/**'

  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    strategy:
      # One AWS account per environment (each teammate has their own). Add a
      # name here once its GitHub Environment + secrets/vars are set up --
      # nothing else in this file needs to change.
      matrix:
        environment: [john]
      fail-fast: false
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - working-directory: frontend
        run: npm ci && npm run build:ci

      - name: Assemble revision bundle
        run: |
          mkdir -p bundle/dist
          cp -r frontend/dist/. bundle/dist/
          cp deploy/frontend/appspec.yml bundle/
          cp -r deploy/frontend/scripts bundle/
          chmod +x bundle/scripts/*.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Push revision and trigger deployment
        working-directory: bundle
        run: |
          aws deploy push \
            --application-name dmz-frontend-app \
            --s3-location s3://${{ vars.CODEDEPLOY_ARTIFACTS_BUCKET }}/frontend/${{ github.sha }}.zip \
            --source .
          aws deploy create-deployment \
            --application-name dmz-frontend-app \
            --deployment-group-name dmz-frontend-dg \
            --s3-location bucket=${{ vars.CODEDEPLOY_ARTIFACTS_BUCKET }},key=frontend/${{ github.sha }}.zip,bundleType=zip

  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      matrix:
        environment: [john]
      fail-fast: false
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Assemble revision bundle
        run: |
          mkdir -p bundle/src
          cp -r backend/. bundle/src/
          cp deploy/backend/appspec.yml bundle/
          cp -r deploy/backend/scripts bundle/
          chmod +x bundle/scripts/*.sh

      - name: Write .env
        run: |
          cat > bundle/src/.env <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          API_VERSION=${{ github.sha }}
          DEBUG=false
          SESSION_COOKIE_SECURE=true
          EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Push revision and trigger deployment
        working-directory: bundle
        run: |
          aws deploy push \
            --application-name dmz-backend-app \
            --s3-location s3://${{ vars.CODEDEPLOY_ARTIFACTS_BUCKET }}/backend/${{ github.sha }}.zip \
            --source .
          aws deploy create-deployment \
            --application-name dmz-backend-app \
            --deployment-group-name dmz-backend-dg \
            --s3-location bucket=${{ vars.CODEDEPLOY_ARTIFACTS_BUCKET }},key=backend/${{ github.sha }}.zip,bundleType=zip
