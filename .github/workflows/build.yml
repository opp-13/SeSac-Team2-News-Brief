name: Build

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build \
            --build-arg VITE_APP_VERSION=${{ github.sha }} \
            -t ${{ vars.DOCKERHUB_USERNAME }}/dmz-frontend:${{ github.sha }} \
            frontend/
          docker push ${{ vars.DOCKERHUB_USERNAME }}/dmz-frontend:${{ github.sha }}

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/dmz-backend:${{ github.sha }} backend/
          docker push ${{ vars.DOCKERHUB_USERNAME }}/dmz-backend:${{ github.sha }}

  # deploy.yml is triggered via workflow_run, which can only see this
  # workflow's overall conclusion -- not needs.*.result for individual jobs.
  # Record what actually got built into a file and hand it over as an
  # artifact so deploy.yml knows which of frontend/backend to roll out.
  record-outputs:
    needs: [build-frontend, build-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "frontend=${{ needs.build-frontend.result == 'success' }}" >> outputs.env
          echo "backend=${{ needs.build-backend.result == 'success' }}" >> outputs.env

      - uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: outputs.env
